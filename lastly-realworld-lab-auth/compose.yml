# Local learning environment only; hard-coded credentials MUST NOT be copied to production.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_only
      MYSQL_DATABASE: lastly
      MYSQL_USER: lastly
      MYSQL_PASSWORD: lastly_dev
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 4s
      retries: 24

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://db:3306/lastly
      DB_USERNAME: lastly
      DB_PASSWORD: lastly_dev
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      - backend

volumes:
  mysql_data:
