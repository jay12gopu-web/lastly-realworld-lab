spring:
  application:
    name: lastly-lab
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lastly}
    username: ${DB_USERNAME:lastly}
    password: ${DB_PASSWORD:lastly_dev}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      group-id: ${KAFKA_GROUP_ID:lastly-order-audit}
    listener:
      ack-mode: record
    producer:
      properties:
        enable.idempotence: true
        acks: all
        max.block.ms: 5000
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  events:
    enabled: ${KAFKA_EVENTS_ENABLED:false}
    topic: ${KAFKA_ORDER_TOPIC:lastly.order.placed}
    poll-ms: 3000
  auth:
    enabled: ${AUTH_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:}
  orders:
    write-enabled: ${ORDERS_WRITE_ENABLED:false}
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
